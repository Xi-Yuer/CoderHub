# Redis Configuration File

# Redis server persistence settings
appendonly no                    # 禁用 AOF，使用 RDB 持久化
save 900 1                        # 每 15 分钟内至少修改 1 个 key 时触发保存
save 300 10                       # 每 5 分钟内至少修改 10 个 key 时触发保存
save 60 10000                     # 每 1 分钟内至少修改 10,000 个 key 时触发保存
rdbcompression no                 # 禁用 RDB 压缩（可提高性能，但增加 RDB 文件大小）
no-appendfsync-on-rewrite yes     # 防止在 AOF 重写期间频繁写入磁盘
loglevel notice                   # 设置日志等级为 'notice'，避免写入过多日志
logfile ""                        # 禁用日志文件输出，仅输出到标准输出
timeout 0                          # 永不超时
tcp-backlog 511                   # 系统最大队列长度，保持默认值

# Network settings
bind 0.0.0.0                      # 监听所有网络接口
port 6379                         # 默认 Redis 端口

# Memory optimization settings
maxmemory-policy volatile-lru     # 仅删除可被丢弃的 key，最小化数据丢失

# Security settings
protected-mode yes                # 启用受保护模式，确保外部无法访问 Redis
requirepass your-strong-password  # 设置访问密码，生产环境中务必启用此项

# AOF (Append Only File) settings
appendfsync everysec              # 每秒写入一次 AOF
auto-aof-rewrite-percentage 100   # 当 AOF 文件大小超出初始大小的 100% 时自动重写
auto-aof-rewrite-min-size 64mb   # 如果 AOF 文件大于 64MB 才进行自动重写

# Cluster settings (如果使用集群功能)
# cluster-enabled yes
# cluster-config-file nodes.conf
# cluster-node-timeout 5000

# Latency monitoring
latency-monitoring-threshold 100   # 设置延迟监控阈值（ms）